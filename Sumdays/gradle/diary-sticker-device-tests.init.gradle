// A separate package, test accounts and in-memory server keep user data untouched.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.buildTypes.getByName('debug').applicationIdSuffix = '.inventorycheck'
            android.defaultConfig.testInstrumentationRunner = 'com.example.sumdays.auth.InventoryTestRunner'
            android.defaultConfig.testInstrumentationRunnerArguments['class'] =
                'com.example.sumdays.stickers.DiaryStickerDeviceTest'
        }
    }
}
